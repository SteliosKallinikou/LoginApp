<div class="wrapper">
  <div class="back-buttons">
    <button  mat-flat-button class="go-back-button" (click)="goBack()"><mat-icon>arrow_back</mat-icon></button>
  </div>
  <h1 class="title">Leaderboards</h1>
  <hr>
 <div class="table-layout">
   <mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
     <ng-container matColumnDef="id">
       <th mat-header-cell *matHeaderCellDef> Id </th>
       <td mat-cell *matCellDef="let element">{{element.id}} </td>
     </ng-container>
     <ng-container matColumnDef="name">
       <th mat-header-cell *matHeaderCellDef> Name </th>
       <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
     </ng-container>
     <ng-container matColumnDef="general-score">
       <th mat-header-cell mat-sort-header="score" *matHeaderCellDef> General-Test Score </th>
       <td mat-cell *matCellDef="let element"> {{element.score}} </td>
     </ng-container>
     <ng-container matColumnDef="advanced-score">
       <th mat-header-cell mat-sort-header="olderScore" *matHeaderCellDef> Advanced-Test Score </th>
       <td mat-cell *matCellDef="let element"> {{element.olderScore}} </td>
     </ng-container>
     <ng-container matColumnDef="medals">
       <th mat-header-cell mat-sort-header="medals" *matHeaderCellDef> Medals </th>
       <td mat-cell *matCellDef="let element">
        @if(sort.active==='score'){
          <app-rating [testScore]="element.score" ></app-rating>
        } @else {
          <app-rating [testScore]="element.olderScore" ></app-rating>
        }
          </td>
     </ng-container>
     <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
       <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index" [ngClass]="{
       'highlight':isTopScore(row.id),
     'highlight-first-two':isFirstAndSecond() && row.id===topScore[0].id || row.id===topScore[1].id,
     'highlight-third': (isFirstAndSecond() && row.id===dataSource.data[3].id)||(!isFirstAndSecond() && row.id===topScore[2].id) }"></tr>
   </mat-table>
 </div>
</div>
