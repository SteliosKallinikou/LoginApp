<div class="wrapper">
  <div class="welcome-header">
    <span class="welcome-message">Hello {{UserName()}} Welcome to your DashBoard!</span>
    @if (UserScore===''|| OlderScore==='') {
      <span>{{UserName()}}'s Score: 0/10</span>
      <span>{{UserName()}}'s 18+Score: 0/10</span>
    } @else {
      <span>{{UserName()}}'s Score: {{UserScore}}/10</span>
      <span>{{UserName()}}'s 18+ Score: {{OlderScore}}/10</span>
    }
    <hr>
  </div>
  <button mat-stroked-button class="dashboard-button" (click)="EditProfile()">Edit Profile Details</button>
  <button mat-stroked-button class="dashboard-button" (click)="GoToGeneralTest()">Go to General Test</button>
  <button mat-stroked-button class="dashboard-button" (click)="GoToOlderTest()" >Go to 18+ Test</button>
  <button mat-stroked-button class="dashboard-button" (click)="LogOut()">Logout</button>
</div>
