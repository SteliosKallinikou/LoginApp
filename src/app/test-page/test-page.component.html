<div class="wrapper">
  <ng-content></ng-content>
  <button class="go-back-button" (click)="goBack()"><mat-icon>arrow_back</mat-icon></button>
  <form [formGroup]="testForm" (submit)="submitQuestion()" class="form">
    @if (isFinished){
      <div class="congratulations-message">
        Congratulations!<br>
        You Have Reached the end of the Test
      </div>
    } @else {
      <label class="input-label" for="Question" > {{questions[currentQuestion]?.question}} </label>
      <hr>
      <mat-radio-group class="radio-buttons" formControlName="question" id="question">
        <mat-radio-button class="answer" *ngFor="let option of questions[currentQuestion]?.options" name="{{option?.answer|json}}" value="{{option?.isCorrect}}">
          <span>Answer {{option?.id}}: {{option?.answer}}</span>
        </mat-radio-button>
      </mat-radio-group>
      <div class="submit-buttons">
        <button type="submit" mat-flat-button [disabled]="testForm.invalid">Submit</button>
      </div>
    }
    <h2 class="points">Score: {{score}}/10</h2>
  </form>
</div>
