<div class="wrapper">
  <h1 class="title">Welcome to Our Login Page</h1>
  <hr>

  <form [formGroup]="loginForm" (submit)="login()" class="form">
    <mat-form-field class="input">
      <mat-label>Username</mat-label>
      <input
        type="userName"
        formControlName="userName"
        matInput placeholder="Enter Your Name"
        required
      />
      <mat-error class="login-error" *ngIf="loginForm.controls['userName'].hasError('required')">*Name is Required to Proceed</mat-error>

    </mat-form-field>
    <mat-form-field class="input">
      <mat-label>Password</mat-label>
      <input type="password"
             formControlName="password"
             matInput placeholder="Enter Your Password"
             required
      />
      <mat-error class="login-error" *ngIf="loginForm.controls['password']!.hasError('required')">*Password is required to login</mat-error>
      <mat-error class="login-error" *ngIf="loginForm.controls['password']!.hasError('minlength')">Password must be at least 6 characters </mat-error>
    </mat-form-field>
    <div class="buttons">
      <button class="submit" mat-flat-button [disabled]="loginForm.invalid" (click)="login()">Login</button>
      <button class="submit" mat-flat-button (click)="register()">Register</button>
    </div>
    @if (!isAuthenticated){
      <mat-error class="login-error">Username or Password not found, please try again</mat-error>
    }
  </form>
</div>
