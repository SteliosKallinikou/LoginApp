
<mat-card class="post-card" appearance="outlined">
  <mat-card-header class="post-header">
    <mat-card-title>{{user().userName}}</mat-card-title>
    <img mat-card-image class="avatar" [ngSrc]="user().profilePicture" priority width="512" alt="profile"
         height="512">
    <mat-card-subtitle>{{date()}}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>
      {{postContent()}}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="likePost()">Like</button>
    <button mat-button (click)="openComments()" >Comment</button>
  </mat-card-actions>
  <mat-card-subtitle class="likes-comments">
    <p>Likes {{post().likes}}</p>
    <p>Comments {{post().comments.length}}</p>
  </mat-card-subtitle>
    <hr>
  @if (canComment){
    <div class="submit-buttons">
        <textarea
          class="comment-text"
          rows="2"
          cols="55"
          placeholder="Whats On Your Mind?"
          [(ngModel)]="commentContent"
          (keydown.enter)="shareComment()"
        ></textarea>
      <button mat-stroked-button>Share Comment</button>
    </div>
  }
    @for (comment of comments; track $index) {
      <mat-card class="comment-card" appearance="outlined">
        <mat-card-header>
          <mat-card-title>{{comment.createdBy}}</mat-card-title>
          <mat-card-subtitle>{{comment.date}} </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{comment.content}}</p>
        </mat-card-content>
      </mat-card>
    }
</mat-card>
