<h2 mat-dialog-title>
  <mat-icon>warning</mat-icon>
  Unsaved Changes</h2>
<hr>
<mat-dialog-content>
  <p>You have Unsaved data are you sure you want to go back?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
<!-- TODO  we can optimize it using  data-close-button attribute-->
  <button mat-button (click)="onConfirm(false)">Cancel</button>
  <button mat-button color="primary" (click)="onConfirm(true)">Yes</button>
</mat-dialog-actions>
