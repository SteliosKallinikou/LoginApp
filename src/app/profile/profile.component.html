  <div class="wrapper">
    <button class="go-back-button" (click)="goBack()"><mat-icon>arrow_back</mat-icon></button>
    <h1 class="title">Profile Editor</h1>
    <form [formGroup]="EditForm" (submit)="Edit()" class="form">
      <label class="input-label" for="UserName">UserName: </label>
      <input class="input-text" id="UserName" type="text" formControlName="UserName" required>
      <label class="input-label" for="Password">Password: </label>
      <input class="input-text" id="Password" type="password" formControlName="Password" required placeholder="">
      <label class="input-label" for="Age">Age: </label>
      <input class="input-text" id="Age" type="text" formControlName="Age" required placeholder="">
      <label class="input-label" for="Email">Email: </label>
      <input class="input-text" id="Email" type="text" formControlName="Email" required placeholder="">
      <button type="submit" class="submit-button" >Submit Changes</button>
    </form>
  </div>
